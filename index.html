<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面武林 · 家园摆放原型</title>
<link rel="stylesheet" href="src/style.css?v=0617m">
</head>
<body>
  <header class="topbar">
    <div class="brand">桌面武林 <span class="ver">家园原型 v0.3 等距</span></div>
    <div class="stats">
      <span class="stat" title="气血">❤ <b id="hpVal">100</b>/<b id="hpMax">100</b></span>
      <span class="stat" title="历练等级">⚔ Lv<b id="lvVal">1</b> <span id="expTxt" class="exp-txt"></span></span>
      <span class="stat" title="内功(功法)">☯ 内功 <b id="neigong">1</b> 级 <span id="ngBar" class="mini"></span></span>
      <span class="stat" id="statusWrap" title="负面状态">状态：<b id="statusVal">正常</b></span>
    </div>
    <div class="topbtns">
      <button id="sortieBtn" class="tb sortie" title="出门历练打怪">⚔ 出战历练</button>
      <button id="meditateBtn" class="tb" title="去打坐台修炼">🧘 打坐</button>
      <button id="sleepBtn" class="tb" title="去床上休息">🛌 上床休息</button>
      <button id="dollBtn" class="tb" title="侠客装备/纸娃娃">🎒 侠客装备</button>
      <button id="dbgPoison" class="tb" title="调试：施加中毒">中毒</button>
      <button id="dbgWeak" class="tb" title="调试：施加虚弱">虚弱</button>
      <button id="dbgHurt" class="tb" title="调试：扣血">受伤</button>
      <button id="resetBtn" class="tb" title="清空重来">↺ 重置</button>
    </div>
  </header>

  <!-- 纸娃娃 + 武器仓库 -->
  <div id="dollModal" class="modal-bg hidden">
    <div class="doll-panel">
      <span id="dollClose" class="close-x">✕</span>
      <div class="doll-col doll-left">
        <h4>侠客 · 装备</h4>
        <div class="doll-slots" id="dollSlots"></div>
      </div>
      <div class="doll-col doll-mid">
        <h4>战斗属性</h4>
        <div id="attrList" class="attr-list"></div>
      </div>
      <div class="doll-col doll-right">
        <h4>武器仓库 <span id="whCount" class="wh-count"></span></h4>
        <div id="whGrid" class="wh-grid"></div>
        <div class="doll-tip">双击装备=直接穿戴；单击=对比属性；拖到槽位也可穿；点已穿装备=卸下。戒指可放戒指1/2。</div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div id="roomWrap" class="room-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <aside class="bag">
      <h3>仓库包 <button id="recallAll" class="tb recall">收回全部</button></h3>
      <div class="cats" id="cats"></div>
      <div class="items" id="items"></div>
      <div id="selBar" class="sel-bar hidden">
        <span id="selName" class="sel-name"></span>
        <button id="selMove" class="tb">移动</button>
        <button id="selRotate" class="tb">旋转</button>
        <button id="selRecall" class="tb">收回</button>
      </div>
      <div class="bag-tip" id="bagTip">点选仓库物品 → 房间里点格摆放。<b>长按</b>已摆放物品=移动；或点选它用「移动」键。床/打坐台点一下主角会走过去。</div>
    </aside>
  </div>

  <!-- 历练结算 -->
  <div id="combatModal" class="modal-bg hidden">
    <div class="combat-panel">
      <h2 id="cmTitle">历练归来</h2>
      <div id="cmBody" class="cm-body"></div>
      <button id="cmClose" class="tb">确定</button>
    </div>
  </div>

  <!-- 横版战斗画面 -->
  <div id="combatView" class="combat-view hidden">
    <canvas id="combatCanvas"></canvas>
    <div class="combat-hud"><span id="combatInfo"></span><button id="combatSkip" class="tb">跳过 ▶▶</button></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="src/combat-core.js?v=0617m"></script>
  <script src="src/game.js?v=0617m"></script>
</body>
</html>
