<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定风波 · 骨架 v0.3（headless快照+规则+日结算+存档+调试）</title>
<style>
  html,body{ margin:0; height:100%; background:#3d5a34; color:#eee;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  #wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; }
  #hud{ width:1024px; max-width:96vw; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:#efe6d2; color:#26201a; border-radius:10px; padding:8px 14px; }
  #hud .stat{ font-size:16px; font-weight:700; } #hud .stat span{ color:#7a5a2b; }
  #hud .inv{ font-size:14px; color:#3a3226; }
  #shop{ display:flex; gap:6px; align-items:center; } #shop .shoplab{ font-size:13px; color:#5a4f3a; }
  .sbtn{ font-family:inherit; font-size:13px; padding:5px 10px; border:1px solid #b7a271; border-radius:7px; background:#e8dcc0; color:#26201a; cursor:pointer; }
  .sbtn:active{ background:#d3c19a; }
  .ic{ width:20px; height:20px; image-rendering:pixelated; vertical-align:-4px; margin-right:3px; }
  #cv{ background:#6b9450; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.3); touch-action:none;
    max-width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
  #toolrow{ width:1024px; max-width:96vw; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tool{ font-family:inherit; font-size:15px; padding:8px 12px; border:2px solid #b7a271; border-radius:8px; background:#e8dcc0; color:#26201a; cursor:pointer; }
  .tool.sel{ background:#8bbf5f; border-color:#3f7a2f; font-weight:700; }
  #usebtn{ font-family:inherit; font-size:16px; font-weight:700; padding:9px 18px; border:2px solid #b5832f; border-radius:8px; background:#e0a94a; color:#26201a; cursor:pointer; margin-left:auto; }
  #debug{ width:1024px; max-width:96vw; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; color:#cfe0c2; }
  #debug button{ font-family:inherit; font-size:12px; padding:4px 9px; border:1px solid #6f8a5e; border-radius:6px; background:#31492a; color:#dcecd0; cursor:pointer; }
  #debug .lbl{ color:#9fb890; }
  #help{ width:1024px; max-width:96vw; font-size:12px; color:#d8e6cc; opacity:.9; }
  #hint{ flex:1 1 240px; min-width:180px; font-size:13px; color:#5a4f3a; }
  #toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:rgba(30,24,16,.92); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .3s; max-width:80vw; text-align:center; pointer-events:none; z-index:9; }
  #toast.show{ opacity:1; } #toast b{ color:#ffd98a; }
  #shopmodal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:20; }
  #shopmodal.open{ display:flex; }
  .shopbox{ width:540px; max-width:92vw; max-height:82vh; overflow:auto; background:#efe6d2; color:#26201a; border:2px solid #b5832f; border-radius:12px; padding:14px 18px; }
  .shophead{ display:flex; align-items:center; gap:12px; font-size:18px; font-weight:700; }
  .shophead .g{ font-size:15px; color:#7a5a2b; } .shophead #shopclose{ margin-left:auto; font-size:16px; border:1px solid #b7a271; background:#e0d3b4; border-radius:6px; padding:2px 9px; cursor:pointer; }
  .shoptabs{ display:flex; gap:8px; margin:12px 0 8px; }
  .stab{ font-family:inherit; font-size:15px; padding:6px 18px; border:2px solid #b7a271; border-radius:8px; background:#e2d6ba; color:#26201a; cursor:pointer; }
  .stab.sel{ background:#8bbf5f; border-color:#3f7a2f; font-weight:700; }
  #shoplist .row{ display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px dashed #cdbf9e; font-size:15px; }
  #shoplist .row img{ width:32px; height:32px; image-rendering:pixelated; }
  #shoplist .row .nm{ flex:1; } #shoplist .row .pr{ color:#7a5a2b; font-size:13px; }
  #shoplist .row button{ font-family:inherit; font-size:13px; padding:4px 10px; border:1px solid #b7a271; border-radius:6px; background:#e8dcc0; cursor:pointer; }
  .shophint{ margin-top:8px; font-size:12px; color:#5a4f3a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat">📅 第<span id="day">1</span>天 <span id="clock">05:00</span></div>
    <div class="stat"><img class="ic" src="../assets/icons/icon_gold.png" alt="" onerror="this.remove()">金币 <span id="gold">50</span></div>
    <div class="stat">❤ <span id="hp">100</span></div>
    <div class="inv" id="inv"></div>
    <span id="shop"><span class="shoplab">杂货铺</span>
      <button class="sbtn" id="buyseed">买麦种(3金)</button>
      <button class="sbtn" id="sellall">卖出全部产出</button></span>
    <div id="hint">WASD/方向键走，空格用工具。作物按天生长，每天05:00鸡鸣结算。</div>
  </div>
  <canvas id="cv" width="1024" height="576"></canvas>
  <div id="toolrow"><div id="tools"></div><button id="usebtn">✋ 使用工具（空格/E）</button></div>
  <div id="debug">
    <span class="lbl">🛠 调试:</span>
    <button id="dbgDay">跳过一天(结算)</button>
    <button id="dbgWeek">快进7天</button>
    <button id="dbgGold">+100金</button>
    <button id="dbgSeed">+麦种×10</button>
    <button id="dbgWheat">+小麦×10</button>
    <button id="dbgSleep">睡觉(回健康)</button>
    <button id="dbgSave">存档</button>
    <button id="dbgReset">新游戏</button>
    <span class="lbl" id="dbgInfo"></span>
  </div>
  <div id="help">操作：<b>WASD/方向键</b> 移动 ｜ <b>空格/E</b> 用工具 ｜ 数字键1-6换工具 ｜ 走到鸡舍/酒缸前用工具互动 ｜ 先耕地→播种→<b>每天浇水</b>→到成熟天数收割。<b>headless架构</b>：删掉画面逻辑照跑；调试面板可秒快进验数值。</div>
</div>
<div id="toast"></div>
<div id="shopmodal">
  <div class="shopbox">
    <div class="shophead">🏪 杂货铺 <span class="g" id="shopgold"></span> <button id="shopclose">✕ 离开</button></div>
    <div class="shoptabs"><button class="stab sel" id="tabbuy">买入</button><button class="stab" id="tabsell">卖出</button></div>
    <div id="shoplist"></div>
    <div class="shophint">买：种子/工具 ｜ 卖：作物/畜产/成品。（走到铺子门前按空格开关）</div>
  </div>
</div>

<script>
"use strict";
// ================= 定风波 · 骨架 v0.3 =================
// 分层：CONFIG(说明书/数据表) → SIM(headless快照+纯规则+日结算) → SAVE(存档+版本) → RENDER(只读快照) → INPUT → DEBUG。
// 铁律：只有4件事改快照(操作/时间/日结算/[多人未做])；画面绝不改快照；settle()是纯函数可快进模拟。
// 时间模型：游戏钟实时走，每天05:00批处理结算(鸡鸣)；不强制睡觉，睡觉=快进结算+回健康。作物按"天"生长。

// ===== CONFIG（说明书：静态常量。真实项目由导表管线从Excel/JSON生成；这里内嵌+validate演示）=====
const CONFIG = {
  // 游戏钟＝星露谷比例(≈10游戏分/7真实秒=1.43)。成熟按"游戏时间"算：测试期用游戏小时(小麦2h)，正式版可换游戏天数(改growMin即可)。
  settings: { gameMinPerRealSec: 1.43, dayMinutes: 1440, startHour: 5 },
  items: {
    "麦种": {cat:"seed", buy:3, sell:0, icon:"icon_maizhong"},
    "稻种": {cat:"seed", buy:1, sell:0, icon:"icon_daozhong"},
    "小麦": {cat:"crop", sell:8, icon:"icon_wheat"},
    "稻谷": {cat:"crop", sell:6, icon:"icon_rice"},
    "鸡蛋": {cat:"produce", sell:10, icon:"icon_egg"},
    "麦酒": {cat:"good", sell:16, icon:"icon_maijiu"},
    "米酒": {cat:"good", sell:14, icon:"icon_mijiu"},
    "金币": {icon:"icon_gold"}
  },
  // growMin=成熟所需"游戏分钟"(需浇水才累积)。测试期:小麦120(2游戏时)、稻谷依次更长。正式版换成天数×1440。
  crops:   { "麦种": {crop:"小麦", growMin:120, en:"wheat"}, "稻种": {crop:"稻谷", growMin:200, en:"rice"} },
  animals: { "鸡": {produces:"鸡蛋", produceMin:240} },      // 每4游戏时产一次
  recipes: { "小麦": {out:"麦酒", ferMin:180}, "稻谷": {out:"米酒", ferMin:240} }, // 酿造游戏分钟
  shop: { buy: ["麦种","稻种"] }  // 铺子可买清单(价取items[id].buy); 可卖=任何 sell>0 的库存
};
// ★数据驱动批量作物（莱布尼茨占位价）：加一行 = 多一种可买种/可种/可收/可卖的作物。田图缺则通用渲染(幼苗→成熟显图标)。growMin 占位公式,莱深平衡时再调。
const CROP_DATA=[
 // [icon id, 中文, 卖价, 种子买价]
 ["yumi","玉米",7,3],["dadou","大豆",9,4],["huasheng","花生",11,4],["mianhua","棉花",15,6],
 ["baicai","白菜",8,3],["luobo","萝卜",8,3],["tudou","土豆",9,4],["fanqie","番茄",12,5],
 ["huanggua","黄瓜",10,4],["nangua","南瓜",13,5],["bocai","菠菜",6,2],["ganlan","甘蓝",8,3],
 ["caomei","草莓",16,6],["xigua","西瓜",18,7],["putao","葡萄",22,9],
];
CROP_DATA.forEach(([id,cn,sell,seedBuy])=>{
  CONFIG.items[cn]={cat:"crop",sell,icon:"icon_"+id};
  CONFIG.items[cn+"种"]={cat:"seed",buy:seedBuy,icon:"icon_"+id};
  CONFIG.crops[cn+"种"]={crop:cn,growMin:90+sell*6,en:id};
  CONFIG.shop.buy.push(cn+"种");
});
// 导表校验：坏行拦下不崩（演示：引用完整性/数值范围）
function validateConfig(){
  const errs=[];
  for(const s in CONFIG.crops){ const c=CONFIG.crops[s];
    if(!CONFIG.items[s]) errs.push(`crop种子${s}不在items`);
    if(!CONFIG.items[c.crop]) errs.push(`crop产物${c.crop}不在items`);
    if(!(c.growMin>0)) errs.push(`crop ${s} growMin非法`); }
  for(const r in CONFIG.recipes){ const rp=CONFIG.recipes[r];
    if(!CONFIG.items[r]) errs.push(`recipe输入${r}不在items`);
    if(!CONFIG.items[rp.out]) errs.push(`recipe产出${rp.out}不在items`); }
  if(errs.length) console.warn("[导表校验] 发现问题(已跳过坏项):", errs);
  else console.log("[导表校验] 配置表通过");
  return errs;
}

// ===== MAP（静态地图布局，说明书；不进快照）=====
const TILE=64, COLS=16, ROWS=9;
const MAP=[]; // MAP[r][c].kind
function inSoil(r,c){ return r>=2&&r<=6&&c>=2&&c<=8; }
for(let r=0;r<ROWS;r++){ MAP.push([]); for(let c=0;c<COLS;c++){
  let k="grass"; if(inSoil(r,c)) k="soil"; MAP[r].push({kind:k}); } }
const COOP={r:1,c:12}; MAP[1][12].kind="coop"; MAP[1][13].kind="coop";
const VATS=[{r:7,c:12},{r:7,c:13}]; VATS.forEach(v=>MAP[v.r][v.c].kind="vat");
// 镇上简略场景：左上角一栋杂货铺(买卖场所)。走到门前用工具/空格开买卖面板。
const SHOP={r:7,c:1}; MAP[7][1].kind="shop"; MAP[7][2].kind="shop"; MAP[7][3].kind="shop"; // 铺子(3格宽底座,左下镇区)
for(let c=0;c<COLS;c++) if(MAP[8][c].kind==="grass") MAP[8][c].kind="townpath"; // 镇上一条石板路(玩家从下方走近铺子)

// ===== SIM（headless：快照 + 纯规则 + 日结算；不碰 DOM/canvas）=====
const SAVE_VER=3;
const SIM = {
  newSnapshot(){
    const s={ version:SAVE_VER, day:1, clock:0, gold:50, hp:100,
      inv:{"麦种":24,"稻种":0,"小麦":0,"稻谷":0,"鸡蛋":0,"麦酒":0,"米酒":0},
      plots:{}, animals:[{grow:0,produce:false},{grow:0,produce:false}], vessels:[{state:"empty"},{state:"empty"}],
      player:{x:TILE*8,y:TILE*7.5,fx:0,fy:1}, fired:{} };
    return s;
  },
  plot(s,r,c){ const k=r+"_"+c; if(!s.plots[k]) s.plots[k]={state:"empty",crop:"",grownMin:0,watered:false,fert:false,grown:false}; return s.plots[k]; },
  firstSeed(s){ for(const seed in CONFIG.crops) if((s.inv[seed]||0)>0) return seed; return ""; },
  firstBrewable(s){ for(const it in CONFIG.recipes) if((s.inv[it]||0)>0) return it; return ""; },
  add(s,it,n){ s.inv[it]=(s.inv[it]||0)+n; },

  // —— 规则（操作改快照）——
  till(s,r,c){ const p=SIM.plot(s,r,c); if(p.state==="empty"){ p.state="tilled"; return "til"; } return "已耕过"; },
  plant(s,r,c){ const p=SIM.plot(s,r,c); if(p.state!=="tilled") return "先耕地"; const seed=SIM.firstSeed(s);
    if(!seed) return "没种子"; s.inv[seed]--; const d=CONFIG.crops[seed]; p.state="planted"; p.crop=d.crop; p.seed=seed; p.grownMin=0; p.watered=false; p.fert=false; p.grown=false; return "plant"; },
  water(s,r,c){ const p=SIM.plot(s,r,c); if(p.state!=="planted") return "没作物"; if(p.watered) return "已浇过"; p.watered=true; return "water"; },
  fert(s,r,c){ const p=SIM.plot(s,r,c); if(p.state!=="planted") return "没作物"; if(p.fert) return "已施肥"; p.fert=true; return "fert"; },
  harvest(s,r,c){ const p=SIM.plot(s,r,c); if(p.state!=="planted") return "无可收"; if(!p.grown) return "没熟";
    SIM.add(s,p.crop,1); const crop=p.crop; p.state="tilled"; p.crop=""; p.grownMin=0; p.watered=false; p.fert=false; p.grown=false; return {ev:"harvest",crop}; },
  collectAnimal(s,i){ const a=s.animals[i]; if(!a.produce) return "还没产出"; a.produce=false; a.grow=0; SIM.add(s,CONFIG.animals["鸡"].produces,1); return "egg"; },
  loadVessel(s,i){ const v=s.vessels[i]; if(v.state!=="empty") return "非空缸"; const crop=SIM.firstBrewable(s);
    if(!crop) return "没原料"; s.inv[crop]--; const rp=CONFIG.recipes[crop]; v.state="fermenting"; v.input=crop; v.prod=rp.out; v.fer=0; return "brew"; },
  collectVessel(s,i){ const v=s.vessels[i]; if(v.state!=="done") return v.state==="empty"?"空缸":"发酵中"; SIM.add(s,v.prod,1); const prod=v.prod; v.state="empty"; v.input=""; v.prod=""; v.fer=0; return {ev:"brewdone",prod}; },
  buySeed(s){ return SIM.buy(s,"麦种"); },
  buy(s,id){ const p=CONFIG.items[id]&&CONFIG.items[id].buy; if(!p) return "不可买"; if(s.gold<p) return "金币不够"; s.gold-=p; SIM.add(s,id,1); return "buy"; },
  sell(s,id,n){ const p=CONFIG.items[id]&&CONFIG.items[id].sell; if(!p) return "不可卖"; const q=Math.min(n||1, s.inv[id]||0); if(q<=0) return "没有可卖"; s.inv[id]-=q; s.gold+=p*q; return {ev:"sold",id,n:q,e:p*q}; },
  sellAll(s){ let e=0; for(const it in CONFIG.items){ const price=CONFIG.items[it].sell||0; const q=s.inv[it]||0; if(price>0&&q>0){ e+=price*q; s.inv[it]=0; } } if(e>0){ s.gold+=e; return {ev:"sale",e}; } return "无可卖"; },

  // —— ★时钟推进：连续按游戏时间累积生长/发酵/产出，过05:00触发日结算(批处理)。纯函数、可任意步长快进 ——
  advanceTime(s, gmin){
    // 作物：浇过水才累积生长(施肥×1.5加速)
    for(const k in s.plots){ const p=s.plots[k];
      if(p.state==="planted" && !p.grown && p.watered){ p.grownMin += gmin*(p.fert?1.5:1);
        const need=CONFIG.crops[p.seed] ? CONFIG.crops[p.seed].growMin : 120; if(p.grownMin>=need) p.grown=true; } }
    // 牲畜产出
    for(const a of s.animals){ if(!a.produce){ a.grow += gmin; if(a.grow>=CONFIG.animals["鸡"].produceMin) a.produce=true; } }
    // 酿造发酵
    for(const v of s.vessels){ if(v.state==="fermenting"){ v.fer += gmin; if(v.fer>=CONFIG.recipes[v.input].ferMin) v.state="done"; } }
    // 时钟 + 日结算
    s.clock += gmin; let settled=0;
    while(s.clock>=CONFIG.settings.dayMinutes){ s.clock-=CONFIG.settings.dayMinutes; SIM.settle(s); settled++; }
    return settled;
  },
  // —— ★日结算(05:00鸡鸣)：每日批处理纯函数。生长已在advanceTime连续累积，这里只挂"每日一次"的批量事件 ——
  settle(s){
    s.day++;
    // TODO(模块化往里加)：商店补货、出货收入结算、NPC事件、季节切换、剧情条件检查
    return s;
  },
  sleep(s){ const rem=CONFIG.settings.dayMinutes - s.clock; SIM.advanceTime(s, rem); s.hp=100; return s; }, // 睡觉=快进到次日05:00(其间作物照长)+回健康
};

// ===== SAVE（存档：序列化快照 + 版本）=====
const SAVE = {
  KEY:"dfb_save_v0_3",
  save(s){ try{ localStorage.setItem(SAVE.KEY, JSON.stringify(s)); return true; }catch(e){ return false; } },
  load(){ try{ const t=localStorage.getItem(SAVE.KEY); if(!t) return null; const s=JSON.parse(t);
    return SAVE.migrate(s); }catch(e){ console.warn("存档读取失败",e); return null; } },
  migrate(s){ if(!s || s.version!==SAVE_VER){ console.log("[存档] 版本不符/缺字段，用新档"); return null; } // 简单迁移：版本不符弃旧；真实项目按版补字段
    return s; },
  clear(){ localStorage.removeItem(SAVE.KEY); }
};

// ===== 全局状态：唯一可变快照 =====
let state = null;

// ===== 美术加载（马奈B像素，缺件占位） =====
const ASSET_W="../assets/world/", ASSET_C="../assets/char/";
const IMG={};
function preload(dir,names){ names.forEach(n=>{ const im=new Image(); im.onload=()=>IMG[n]=im; im.src=dir+n+".png"; }); }
preload(ASSET_W,["soil_empty","soil_tilled","crop_wheat_0","crop_wheat_1","crop_wheat_2","crop_wheat_3",
 "crop_rice_0","crop_rice_1","crop_rice_2","crop_rice_3","coop_1","chicken_idle","chicken_ready",
 "vessel_empty","vessel_fermenting","vessel_done","building_shop"]);
preload(ASSET_C,["hero_walk","hero_idle"]);
preload("../assets/icons/", CROP_DATA.map(c=>"icon_"+c[0])); // 通用作物渲染成熟显图标,需把作物图标也载进canvas
preload(ASSET_W, CROP_DATA.flatMap(c=>["0","1","2","3"].map(i=>"crop_"+c[0]+"_"+i))); // 预接各作物精致4阶段田图: 马奈commit即自动替掉通用占位
const CROP_EN={"小麦":"wheat","稻谷":"rice"};

// ===== INPUT（读输入→改快照）=====
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
cv.width=COLS*TILE; cv.height=ROWS*TILE; ctx.imageSmoothingEnabled=false;
const keys={}; let moveTarget=null, animT=0, moving=false;
const TOOLS=[{name:"锄头",act:"till",icon:"icon_hoe"},{name:"种子",act:"plant",icon:"icon_maizhong"},{name:"水壶",act:"water",icon:"icon_wateringcan"},
  {name:"肥料",act:"fert",icon:"icon_fertilizer"},{name:"镰刀",act:"harvest",icon:"icon_sickle"},{name:"手",act:"hand",icon:""}];
const ITEM_ICON={"麦种":"icon_maizhong","稻种":"icon_daozhong","小麦":"icon_wheat","稻谷":"icon_rice","鸡蛋":"icon_egg","麦酒":"icon_maijiu","米酒":"icon_mijiu"};
let selTool=0;
addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); keys[k]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if(k==="escape"&&shopOpen){ closeShop(); return; }
  if(k===" "||k==="e") useTool();
  const n=parseInt(e.key); if(n>=1&&n<=TOOLS.length){ selTool=n-1; renderTools(); } });
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
cv.addEventListener("pointerdown",e=>{ const r=cv.getBoundingClientRect(); moveTarget={x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)}; });

function facedCell(){ const pc=Math.floor(state.player.x/TILE), pr=Math.floor(state.player.y/TILE);
  return {r:pr+Math.round(state.player.fy), c:pc+Math.round(state.player.fx)}; }
function setHint(t){ document.getElementById("hint").textContent=t; }
function toast(html){ const el=document.getElementById("toast"); el.innerHTML=html; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2400); }
function fireOnce(key,html){ if(!state.fired[key]){ state.fired[key]=true; toast(html); } }

const HINTS={til:"开垦了地，可播种。",plant:"播了种，记得每天浇水。",water:"浇了水，明早结算长一天。",fert:"施了肥，明早多长一天。",egg:"收了鸡蛋。",brew:"投料酿造，按天发酵。",buy:"买了1个麦种。"};
function useTool(){
  if(shopOpen){ closeShop(); return; }
  const {r,c}=facedCell(); if(r<0||c<0||r>=ROWS||c>=COLS) return;
  const kind=MAP[r][c].kind;
  if(kind==="shop"){ openShop(); return; }
  if(kind==="coop"){ const res=SIM.collectAnimal(state,0); if(res==="egg"){ fireOnce("first_egg","<b>初次收蛋</b> 畜栏第一份产出到手。"); setHint(HINTS.egg);} else setHint(res); refreshHUD(); return; }
  if(kind==="vat"){ const vi=VATS.findIndex(v=>v.r===r&&v.c===c); const res=SIM.loadVesselOrCollect(vi); return; }
  if(kind!=="soil"){ setHint("这里不能耕作。"); return; }
  const act=TOOLS[selTool].act; let res;
  if(act==="till") res=SIM.till(state,r,c), res==="til"&&fireOnce("first_till","<b>新土初开</b> 松土可播种。");
  else if(act==="plant"){ res=SIM.plant(state,r,c); if(res==="plant") fireOnce("first_plant","<b>种子入土</b> 浇过水，作物便会生长。"); }
  else if(act==="water"){ res=SIM.water(state,r,c); if(res==="water") fireOnce("first_water","<b>清泉润土</b> 浇水后作物才开始生长。"); }
  else if(act==="fert"){ res=SIM.fert(state,r,c); if(res==="fert") fireOnce("first_fertilize","<b>沃土催青</b> 施肥可选，只加速。"); }
  else if(act==="harvest"){ res=SIM.harvest(state,r,c); if(res&&res.ev==="harvest") fireOnce("first_harvest","<b>初获</b> 收成入手，可酿造或出售。"); }
  else res="选对工具再用";
  if(typeof res==="string" && HINTS[res]) setHint(HINTS[res]); else if(typeof res==="string") setHint(res);
  else if(res&&res.ev==="harvest") setHint("收获了"+res.crop+"。可拿去酒缸酿酒或到杂货铺卖。");
  refreshHUD();
}
SIM.loadVesselOrCollect=function(vi){ const v=state.vessels[vi];
  if(v.state==="done"){ const res=SIM.collectVessel(state,vi); if(res.ev==="brewdone"){ fireOnce("first_brew_done","<b>新酿出窖</b> 农产变成更值钱的成品。"); setHint("取了"+res.prod+"，到杂货铺卖更值钱。"); } }
  else if(v.state==="empty"){ const res=SIM.loadVessel(state,vi); if(res==="brew"){ fireOnce("first_brew_load","<b>封缸待成</b> 按天发酵，成熟后回来取酒。"); setHint(HINTS.brew);} else setHint(res); }
  else setHint("发酵中，按天出窖。"); refreshHUD();
};

// ===== RENDER（只读快照，不改它）=====
function clockStr(){ const tot=(CONFIG.settings.startHour*60 + state.clock)%1440; const h=Math.floor(tot/60), m=tot%60; return String(h).padStart(2,"0")+":"+String(Math.floor(m/10)*10).padStart(2,"0"); }
function renderTools(){ const box=document.getElementById("tools"); box.innerHTML="";
  TOOLS.forEach((t,i)=>{ const b=document.createElement("button"); b.className="tool"+(i===selTool?" sel":"");
    b.innerHTML=(t.icon?`<img class="ic" src="../assets/icons/${t.icon}.png" onerror="this.remove()">`:"")+(i+1)+" "+t.name;
    b.onclick=()=>{ selTool=i; renderTools(); }; box.appendChild(b); }); }
function icImg(n){ return n?`<img class="ic" src="../assets/icons/${n}.png" onerror="this.remove()">`:""; }
function refreshHUD(){
  document.getElementById("day").textContent=state.day;
  document.getElementById("clock").textContent=clockStr();
  document.getElementById("gold").textContent=state.gold;
  document.getElementById("hp").textContent=state.hp;
  let s="", shown=0;
  for(const it in state.inv){ const q=state.inv[it]||0; if(q>0 && shown<9){ const ic=(CONFIG.items[it]&&CONFIG.items[it].icon)||ITEM_ICON[it]; s+=icImg(ic)+`${it}×${q}　`; shown++; } }
  if(!s) s=icImg("icon_maizhong")+"麦种×0";
  document.getElementById("inv").innerHTML=s;
  document.getElementById("dbgInfo").textContent=`| 快照:第${state.day}天 ${clockStr()} 金${state.gold}`;
}
function cropStage(p){ if(p.grown) return 3; if(p.grownMin<=0) return p.watered?1:0;
  const need=CONFIG.crops[p.seed]?CONFIG.crops[p.seed].growMin:120; return (p.grownMin/need)>=0.6?2:1; }
function draw(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const kind=MAP[r][c].kind, x=c*TILE, y=r*TILE;
    if(kind==="grass"){ ctx.fillStyle=((r+c)&1)?"#6b9450":"#659049"; ctx.fillRect(x,y,TILE,TILE); }
    else if(kind==="soil"){ drawSoil(r,c,x,y); }
    else if(kind==="townpath"){ ctx.fillStyle=((r+c)&1)?"#b8a888":"#b0a080"; ctx.fillRect(x,y,TILE,TILE); }
    else { ctx.fillStyle="#6b9450"; ctx.fillRect(x,y,TILE,TILE); } }
  drawCoop(); drawVats(); drawShop(); drawPlayer();
  const f=facedCell(); if(f.r>=0&&f.c>=0&&f.r<ROWS&&f.c<COLS){ ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=2; ctx.strokeRect(f.c*TILE+2,f.r*TILE+2,TILE-4,TILE-4); }
  // 夜晚压暗
  const tot=(CONFIG.settings.startHour*60+state.clock)%1440; let dark=0;
  if(tot<300||tot>=1140) dark=0.35; else if(tot>=1020) dark=(tot-1020)/120*0.35;
  if(dark>0){ ctx.fillStyle=`rgba(20,24,60,${dark})`; ctx.fillRect(0,0,cv.width,cv.height); }
}
function drawSoil(r,c,x,y){
  const p=state.plots[r+"_"+c];
  const soilKey=(p&&p.state!=="empty")?"soil_tilled":"soil_empty";
  if(IMG[soilKey]) ctx.drawImage(IMG[soilKey],x,y,TILE,TILE);
  else { ctx.fillStyle=(p&&p.state!=="empty")?"#7a5a38":"#8a6d4b"; ctx.fillRect(x,y,TILE,TILE); }
  if(p&&p.state==="planted"){
    const si=cropStage(p), en=CONFIG.crops[p.seed]?CONFIG.crops[p.seed].en:"wheat", ck="crop_"+en+"_"+si;
    if(IMG[ck]){ const im=IMG[ck]; const dh=TILE*im.height/im.width; ctx.drawImage(im,x,y+TILE-dh,TILE,dh); } // 精致4阶段田图
    else { // 通用渲染：幼苗随阶段长高，成熟显作物图标
      const icon=CONFIG.items[p.crop]&&CONFIG.items[p.crop].icon;
      if(p.grown && IMG[icon]){ ctx.drawImage(IMG[icon], x+TILE*0.15, y+TILE*0.1, TILE*0.7, TILE*0.7); }
      else { const h=6+si*13; ctx.fillStyle="#4e9a3f"; ctx.fillRect(x+TILE*0.44,y+TILE-6-h,TILE*0.12,h);
        if(si>=2){ ctx.fillStyle="#5bb04a"; ctx.fillRect(x+TILE*0.28,y+TILE-6-h,TILE*0.44,4); } }
    }
    ctx.font="10px sans-serif"; ctx.textAlign="center";
    if(p.grown){ ctx.fillStyle="#2f6a2f"; ctx.fillText("✔可收",x+TILE/2,y+12); }
    else if(!p.watered){ ctx.fillStyle="#cfe6ff"; ctx.fillText("需浇水",x+TILE/2,y+12); }
    else { ctx.fillStyle="#dfe"; const need=CONFIG.crops[p.seed].growMin; ctx.fillText(Math.floor(p.grownMin/need*100)+"%",x+TILE/2,y+12); }
  }
}
function drawCoop(){ const x=COOP.c*TILE,y=COOP.r*TILE; const a=state.animals[0];
  if(IMG["coop_1"]) ctx.drawImage(IMG["coop_1"],x,y-32,128,96); else { ctx.fillStyle="#8a5a34"; ctx.fillRect(x+4,y+4,TILE*2-8,TILE-8); }
  const ck=a.produce?"chicken_ready":"chicken_idle";
  if(IMG[ck]) ctx.drawImage(IMG[ck],x+TILE*1.1,y+TILE*0.35,48,48);
  ctx.fillStyle="#26201a"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText("鸡舍",x+TILE,y+TILE-6);
  if(a.produce){ ctx.fillStyle="#2f6a2f"; ctx.fillText("✔蛋",x+TILE*0.7,y+14); } }
function drawVats(){ VATS.forEach((pos,i)=>{ const v=state.vessels[i], x=pos.c*TILE, y=pos.r*TILE;
  const vk=v.state==="empty"?"vessel_empty":(v.state==="fermenting"?"vessel_fermenting":"vessel_done");
  if(IMG[vk]) ctx.drawImage(IMG[vk],x,y-16,64,80); else { ctx.fillStyle="#8a8aa8"; ctx.beginPath(); ctx.ellipse(x+TILE/2,y+TILE/2,TILE*0.3,TILE*0.4,0,0,7); ctx.fill(); }
  ctx.fillStyle="#26201a"; ctx.font="11px sans-serif"; ctx.textAlign="center";
  let lab=v.state==="empty"?"空缸":(v.state==="fermenting"?(Math.floor(v.fer/CONFIG.recipes[v.input].ferMin*100)+"%"):"✔出窖");
  ctx.fillText(lab,x+TILE/2,y+TILE-2); }); }
function heroRow(){ if(state.player.fy>0)return 0; if(state.player.fy<0)return 1; if(state.player.fx<0)return 2; return 3; }
function drawPlayer(){ const x=state.player.x,y=state.player.y;
  ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(x,y+16,13,6,0,0,7); ctx.fill();
  if(IMG["hero_walk"]){ const row=heroRow(), col=moving?[1,2,3,2][Math.floor(animT*8)%4]:0; ctx.drawImage(IMG["hero_walk"],col*64,row*96,64,96,x-32,y-80,64,96); }
  else if(IMG["hero_idle"]) ctx.drawImage(IMG["hero_idle"],x-32,y-80,64,96);
  else { ctx.fillStyle="#4a7a4a"; ctx.fillRect(x-9,y-6,18,22); ctx.fillStyle="#f0c9a0"; ctx.beginPath(); ctx.arc(x,y-14,9,0,7); ctx.fill(); } }

// ===== 铺子买卖面板（走进铺子开；买卖走 SIM 规则）=====
let shopOpen=false, shopTab="buy";
function openShop(){ shopOpen=true; document.getElementById("shopmodal").classList.add("open"); renderShop(); }
function closeShop(){ shopOpen=false; document.getElementById("shopmodal").classList.remove("open"); }
function renderShop(){
  document.getElementById("shopgold").textContent="金币 "+state.gold;
  const list=document.getElementById("shoplist"); list.innerHTML="";
  if(shopTab==="buy"){
    CONFIG.shop.buy.forEach(id=>{ const it=CONFIG.items[id]; if(!it||!it.buy) return;
      const row=document.createElement("div"); row.className="row";
      row.innerHTML=`${icImg(it.icon)}<span class="nm">${id}</span><span class="pr">买价 ${it.buy}</span>`;
      const b=document.createElement("button"); b.textContent="买 1";
      b.onclick=()=>{ const r=SIM.buy(state,id); if(r==="buy"){ renderShop(); refreshHUD(); } else setHint(r); };
      row.appendChild(b); list.appendChild(row); });
  } else {
    let any=false;
    for(const id in CONFIG.items){ const it=CONFIG.items[id]; const q=state.inv[id]||0;
      if((it.sell||0)>0 && q>0){ any=true; const row=document.createElement("div"); row.className="row";
        row.innerHTML=`${icImg(it.icon)}<span class="nm">${id} ×${q}</span><span class="pr">卖价 ${it.sell}</span>`;
        const b1=document.createElement("button"); b1.textContent="卖1"; b1.onclick=()=>{ SIM.sell(state,id,1); renderShop(); refreshHUD(); };
        const b2=document.createElement("button"); b2.textContent="全卖"; b2.onclick=()=>{ const r=SIM.sell(state,id,q); if(r&&r.ev==="sold") fireOnce("first_sale","<b>第一笔进项</b> 让三条生产链彼此供给。"); renderShop(); refreshHUD(); };
        row.appendChild(b1); row.appendChild(b2); list.appendChild(row); } }
    if(!any) list.innerHTML=`<div class="row">还没有可卖的东西——去收获、收蛋、酿酒吧。</div>`;
  }
}
function drawShop(){ const x=SHOP.c*TILE, y=SHOP.r*TILE;
  if(IMG["building_shop"]) ctx.drawImage(IMG["building_shop"], x, y+TILE-187, 192, 187); // 3格宽×~3高,底部对齐,门朝下
  else { ctx.fillStyle="#a9713e"; ctx.fillRect(x+4,y+4,TILE*3-8,TILE-8); ctx.fillStyle="#caa04a"; ctx.fillRect(x,y-12,TILE*3,18); }
  ctx.fillStyle="#f4e8c8"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText("杂货铺",x+TILE*1.5,y+TILE-4); }

// ===== 主循环：读输入 → 推进时间 → 画 =====
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(shopOpen){ draw(); refreshHUD(); requestAnimationFrame(loop); return; } // 开铺子时暂停时间/移动
  // 移动
  let mx=0,my=0;
  if(keys["w"]||keys["arrowup"])my-=1; if(keys["s"]||keys["arrowdown"])my+=1;
  if(keys["a"]||keys["arrowleft"])mx-=1; if(keys["d"]||keys["arrowright"])mx+=1;
  if(mx||my) moveTarget=null;
  if(!mx&&!my&&moveTarget){ const dx=moveTarget.x-state.player.x,dy=moveTarget.y-state.player.y,d=Math.hypot(dx,dy); if(d>4){mx=dx/d;my=dy/d;} else moveTarget=null; }
  if(mx||my){ const d=Math.hypot(mx,my)||1; mx/=d; my/=d;
    state.player.fx=Math.abs(mx)>Math.abs(my)?Math.sign(mx):0; state.player.fy=Math.abs(my)>=Math.abs(mx)?Math.sign(my):0;
    const spd=150,nx=state.player.x+mx*spd*dt,ny=state.player.y+my*spd*dt;
    if(walkable(nx,state.player.y))state.player.x=nx; if(walkable(state.player.x,ny))state.player.y=ny;
    state.player.x=Math.max(10,Math.min(cv.width-10,state.player.x)); state.player.y=Math.max(10,Math.min(cv.height-10,state.player.y)); }
  moving=!!(mx||my); if(moving)animT+=dt; else animT=0;
  // 时间推进（结算在 advanceTime 内）
  const before=state.day;
  const settled=SIM.advanceTime(state, dt*CONFIG.settings.gameMinPerRealSec);
  if(settled>0){ onNewDay(settled); }
  draw(); refreshHUD();
  requestAnimationFrame(loop);
}
function walkable(x,y){ const c=Math.floor(x/TILE),r=Math.floor(y/TILE); if(r<0||c<0||r>=ROWS||c>=COLS)return false; const k=MAP[r][c].kind; return k==="grass"||k==="soil"; }
function onNewDay(n){ toast(`🐓 <b>第${state.day}天</b> 天亮了（05:00 结算）`); SAVE.save(state); }

// ===== DEBUG 面板 =====
function bindDebug(){
  document.getElementById("dbgDay").onclick=()=>{ SIM.advanceTime(state, CONFIG.settings.dayMinutes); toast(`⏩ 快进1天→第${state.day}天`); refreshHUD(); };
  document.getElementById("dbgWeek").onclick=()=>{ SIM.advanceTime(state, 7*CONFIG.settings.dayMinutes); toast(`⏩ 快进7天→第${state.day}天`); refreshHUD(); };
  document.getElementById("dbgGold").onclick=()=>{ state.gold+=100; refreshHUD(); };
  document.getElementById("dbgSeed").onclick=()=>{ SIM.add(state,"麦种",10); refreshHUD(); };
  document.getElementById("dbgWheat").onclick=()=>{ SIM.add(state,"小麦",10); refreshHUD(); };
  document.getElementById("dbgSleep").onclick=()=>{ SIM.sleep(state); toast(`😴 睡到第${state.day}天，健康回满`); refreshHUD(); };
  document.getElementById("dbgSave").onclick=()=>{ SAVE.save(state)?toast("💾 已存档"):toast("存档失败"); };
  document.getElementById("dbgReset").onclick=()=>{ SAVE.clear(); state=SIM.newSnapshot(); toast("🆕 新游戏"); refreshHUD(); };
  document.getElementById("usebtn").onclick=useTool;
  document.getElementById("buyseed").onclick=()=>{ const r=SIM.buySeed(state); setHint(r==="buy"?"买了1个麦种(-3金)。":r); refreshHUD(); };
  document.getElementById("sellall").onclick=()=>{ const r=SIM.sellAll(state); if(r&&r.ev==="sale"){ fireOnce("first_sale","<b>第一笔进项</b> 让三条生产链彼此供给。"); setHint(`卖出 +${r.e}金。`);} else setHint(r); refreshHUD(); };
  document.getElementById("shopclose").onclick=closeShop;
  document.getElementById("tabbuy").onclick=()=>{ shopTab="buy"; document.getElementById("tabbuy").classList.add("sel"); document.getElementById("tabsell").classList.remove("sel"); renderShop(); };
  document.getElementById("tabsell").onclick=()=>{ shopTab="sell"; document.getElementById("tabsell").classList.add("sel"); document.getElementById("tabbuy").classList.remove("sel"); renderShop(); };
}

// ===== 启动 =====
validateConfig();
state = SAVE.load() || SIM.newSnapshot();
renderTools(); bindDebug(); refreshHUD();
if(location.search.indexOf("shop")>=0){ SIM.add(state,"小麦",3); SIM.add(state,"鸡蛋",2); openShop(); } // 验证/演示：直接开铺子
requestAnimationFrame(loop);

// headless 自检：无画面也能快进模拟（控制台可见）
window.simSelfTest=function(days){ const s=SIM.newSnapshot(); SIM.till(s,2,2); SIM.plant(s,2,2); SIM.water(s,2,2);
  SIM.advanceTime(s, (days||1)*CONFIG.settings.dayMinutes); const p=s.plots["2_2"];
  console.log(`[自检] 模拟${days}天: grownMin=${p.grownMin} grown=${p.grown} day=${s.day}`); return p; };
</script>
