<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界圣经 · 角色/剧情/时间线 一致性工具</title>
<style>
  :root{ --bg:#1b1e24; --panel:#242832; --panel2:#2c313d; --ink:#e7e3d8; --dim:#9aa0ac; --line:#39404e; --acc:#7fae5e; --warn:#e0813a; --bad:#d9534f; --gold:#c9a94a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:var(--gold); }
  header{ display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1{ font-size:17px; margin:0; font-weight:700; }
  header input.title{ background:transparent; border:none; color:var(--ink); font-size:17px; font-weight:700; width:auto; min-width:120px; }
  header .sp{ flex:1; }
  .btn{ font-family:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); color:var(--ink); cursor:pointer; }
  .btn:hover{ border-color:var(--acc); }
  .btn.acc{ background:var(--acc); border-color:var(--acc); color:#16200f; font-weight:700; }
  .tabs{ display:flex; gap:4px; padding:8px 16px 0; background:var(--panel); }
  .tab{ padding:8px 16px; border:1px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0; background:var(--panel2); color:var(--dim); cursor:pointer; font-size:14px; }
  .tab.sel{ background:var(--bg); color:var(--ink); font-weight:700; border-color:var(--line); }
  .tab .badge{ background:var(--bad); color:#fff; border-radius:9px; padding:0 6px; font-size:11px; margin-left:6px; }
  main{ display:flex; height:calc(100vh - 96px); }
  .list{ width:300px; border-right:1px solid var(--line); overflow:auto; background:var(--panel); flex:none; }
  .list .add{ position:sticky; top:0; padding:8px; background:var(--panel); border-bottom:1px solid var(--line); }
  .list .add input{ width:100%; padding:7px 9px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--ink); font-family:inherit; }
  .row{ padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px; }
  .row:hover{ background:var(--panel2); }
  .row.sel{ background:var(--panel2); font-weight:600; box-shadow:inset 0 0 0 1px var(--line); }
  .row .meta{ color:var(--dim); font-size:12px; margin-top:2px; }
  .row.conflict{ box-shadow:inset 3px 0 0 var(--bad); }
  .edit{ flex:1; overflow:auto; padding:16px 22px; }
  .edit .empty{ color:var(--dim); margin-top:40px; text-align:center; }
  .fld{ margin-bottom:12px; }
  .fld label{ display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .fld input, .fld textarea, .fld select{ width:100%; padding:8px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--ink); font-family:inherit; font-size:14px; }
  .fld textarea{ min-height:70px; resize:vertical; }
  .frow{ display:flex; gap:10px; } .frow .fld{ flex:1; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:3px 10px; font-size:13px; cursor:pointer; }
  .chip.on{ background:var(--acc); color:#16200f; border-color:var(--acc); }
  .sec{ margin:18px 0 8px; font-size:13px; color:var(--gold); border-bottom:1px solid var(--line); padding-bottom:4px; }
  .sec .npctog{ font-weight:400; font-size:12px; color:var(--dim); float:right; cursor:pointer; }
  .sec2{ margin:12px 0 6px; font-size:12px; color:var(--dim); letter-spacing:.5px; }
  .cats{ display:flex; flex-wrap:wrap; gap:6px; }
  .catbtn{ font-family:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:7px; background:transparent; cursor:pointer; }
  .catbtn.on{ font-weight:700; }
  .catdot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .npcbox{ border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:0 8px 8px 0; padding:6px 12px 12px; background:rgba(127,174,94,.05); }
  .gift label{ display:flex; align-items:center; gap:6px; }
  .heart{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .heart input{ padding:6px 8px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--ink); font-family:inherit; }
  .rel{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .rel select,.rel input{ padding:6px 8px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; color:var(--ink); font-family:inherit; }
  .x{ color:var(--bad); cursor:pointer; padding:0 6px; }
  .tl{ padding:8px 0; }
  .tlgroup{ margin-bottom:6px; }
  .tltime{ position:sticky; left:0; font-weight:700; color:var(--gold); font-size:13px; padding:6px 0 2px; }
  .tlitem{ margin-left:14px; padding:8px 12px; border-left:2px solid var(--line); background:var(--panel); border-radius:0 8px 8px 0; margin-bottom:5px; cursor:pointer; }
  .tlitem:hover{ background:var(--panel2); }
  .tlitem .who{ color:var(--dim); font-size:12px; margin-top:3px; }
  .conf{ padding:10px 12px; border:1px solid var(--bad); border-radius:8px; margin-bottom:8px; background:#2a1d1d; }
  .conf .t{ color:var(--bad); font-weight:700; }
  .conf .lk{ color:var(--gold); cursor:pointer; text-decoration:underline; }
  .ok{ color:var(--acc); }
  .tag{ display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:11px; color:var(--dim); margin:0 3px 3px 0; }
  .del{ margin-top:18px; }
  small.hint{ color:var(--dim); }
  /* 横向时间轴图 */
  .tlwrap{ display:flex; flex-direction:column; width:100%; height:100%; }
  .tlmain{ display:flex; flex:1; min-height:0; }
  .axisband{ flex:none; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden; }
  .axisband .axhead{ display:flex; align-items:center; gap:10px; padding:6px 14px 0; color:var(--dim); font-size:12px; }
  .axsvg{ display:block; }
  .axsvg text.axt{ fill:var(--gold); font-size:12px; }
  .axsvg text.axlbl{ fill:var(--ink); font-size:12px; }
  .axsvg text.axlbl.bad{ fill:var(--bad); }
  .axsvg .axnode:hover circle{ stroke:var(--gold); stroke-width:2; }
  .axsvg .axnode:hover text.axlbl{ fill:var(--gold); }
  .axempty{ padding:14px; color:var(--dim); font-size:13px; }
  .tinput{ display:inline-flex; align-items:center; gap:6px; }
  .tinput select, .tinput input{ padding:8px 8px; background:var(--panel2); border:1px solid var(--line); border-radius:7px; color:var(--ink); font-family:inherit; font-size:14px; }
  .tinput input.tmag{ width:78px; }
  .tinput input.tmag:disabled{ opacity:.4; }
  .tinput .tu{ color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  📖 <input class="title" id="dbTitle" value="世界圣经">
  <span class="sp"></span>
  <small class="hint">时间单位</small>
  <input id="unit" style="width:70px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink)" value="年">
  <button class="btn" id="expBtn">⬇ 导出</button>
  <button class="btn" id="impBtn">⬆ 导入</button>
  <input type="file" id="impFile" accept=".json" style="display:none">
  <span id="saveState" class="hint" style="font-size:12px"></span>
</header>
<div class="tabs">
  <div class="tab sel" data-t="chars">角色</div>
  <div class="tab" data-t="timeline">世界时间线</div>
  <div class="tab" data-t="check">一致性检查 <span class="badge" id="confBadge" style="display:none">0</span></div>
</div>
<main id="main"></main>

<script>
"use strict";
const KEY="storybible_v1";
let DB = load() || { meta:{title:"世界圣经", unit:"年"}, chars:[], events:[] };
if(location.search.indexOf("demo")>=0){ DB={ meta:{title:"定风波·示例世界", unit:"年"}, chars:[
  {id:"lin",category:"lead",name:"林苏",alias:"苏郎",role:"主角/务农少年侠",faction:"青城",born:0,died:null,desc:"少年习农，后入江湖。",tags:["主角","农隐"],trope:"闷头种田的乡下少年",hiddenDepth:"外表与世无争，实则背负一桩不肯说破的血仇；越是温和，越怕自己动手那天。",voice:"话少、实在，偶尔一句戳心",rels:[{to:"qin",type:"师徒"},{to:"li",type:"仇敌"}]},
  {id:"qin",category:"main",name:"秦戍",alias:"铁手",role:"铸剑师/师父",faction:"青城",born:-40,died:20,desc:"林苏之师，卒于年20。",tags:["长辈"],trope:"沉默寡言的老铸剑师",hiddenDepth:"一生打的最好的一把剑从未出鞘——他怕的不是敌人，是徒弟走上和自己一样的路。",voice:"惜字如金，话里带铁",rels:[{to:"lin",type:"师徒"}]},
  {id:"li",category:"main",name:"厉九",role:"反派/血刀门",faction:"血刀门",born:-25,died:null,desc:"残酷，逼主角承担流血代价。",tags:["反派"],trope:"嗜血成性的血刀门凶徒",hiddenDepth:"他的残忍是一套自证哲学：只有先让别人流血，自己当年那笔血债才不算白欠。",voice:"轻佻、句句挑衅",rels:[]},
  {id:"liu",category:"datable",name:"柳如烟",role:"醉仙楼掌柜",faction:"镇上",born:-22,died:null,desc:"无瑕镇醉仙楼掌柜，消息最灵通的人。",tags:["NPC","情报"],trope:"八面玲珑的酒楼老板娘",hiddenDepth:"笑迎八方客，账房暗格里却压着一张十年前的通缉画像——画上是她自己。",voice:"爽利、带三分打趣",isNPC:true,birthday:"夏·8",routeLinks:"商→打通行脚商路；人情→熟络后透露镇上暗线情报",schedule:{home:"醉仙楼后院",work:"醉仙楼柜台(午后~夜)",evening:"楼中待客"},gifts:{loved:["女儿红","并蒂莲簪"],liked:["新茶","话本"],disliked:["活鱼(嫌腥)","符纸"]},lines:{met:"客官面生，头回来醉仙楼？楼上请。",warm:"又是你呀——老位子给你留着呢。",close:"有些话我只跟自己人说……你算一个。"},hearts:[{h:2,place:"醉仙楼·雨夜",desc:"她替你挡下一桩找茬，顺口问起你的来历。"},{h:6,place:"后院账房",desc:"你撞见那张通缉画像，她第一次卸下笑脸。"}],rels:[{to:"lin",type:"熟客"}]}
], events:[
  {id:"e1",time:5,title:"拜师青城",place:"青城",type:"主线",chars:["lin","qin"],desc:"林苏拜秦戍为师。"},
  {id:"e2",time:5,title:"洛阳惊变",place:"洛阳",type:"主线",chars:["lin"],desc:"（示例冲突：林苏同一年既在青城又在洛阳）"},
  {id:"e3",time:20,title:"秦戍之死",place:"青城",type:"主线",chars:["qin","li"],desc:"秦戍死于厉九之手。"},
  {id:"e4",time:30,title:"故人重逢",place:"江南",type:"支线",chars:["lin","qin"],desc:"（示例冲突：秦戍已卒于年20，却在年30出场）"},
  {id:"e5",time:32,title:"血刀之约",place:"血刀门",type:"战斗",chars:["lin","li"],desc:"林苏与厉九决战。"}
] }; }
let tab="chars", selChar=null, selEvent=null;
{ const tp=location.search.match(/tab=(\w+)/); if(tp) tab=tp[1];
  const ep=location.search.match(/ev=([\w]+)/); if(ep) selEvent=ep[1];
  const cp=location.search.match(/ch=([\w]+)/); if(cp) selChar=cp[1]; } // 截图/测试用

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); const s=document.getElementById("saveState"); s.textContent="已保存 "+new Date().toLocaleTimeString(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function charName(id){ const c=DB.chars.find(c=>c.id===id); return c?c.name:"⚠未知("+id+")"; }
function esc(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
// 角色分类(固定4档,区别于自定义标签)：每档一个颜色,在左栏区别显示
const CATS=[
  {k:"lead",    label:"主角",           color:"#c9a94a"},
  {k:"datable", label:"可攻略主要角色", color:"#e0729a"},
  {k:"main",    label:"不可攻略主要角色", color:"#5aa0c9"},
  {k:"minor",   label:"次要及功能性角色", color:"#8a93a3"}
];
function catOf(c){ return CATS.find(x=>x.k===c.category); }
// 架空世界时间：以「游戏开始的第一年」为基准(中间线)，内部存有符号偏移 V。
// V=0 ⇒ 游戏第1年(基准)；V≥1 ⇒ 游戏第(V+1)年；V≤-1 ⇒ 游戏开始前(−V)年。
function fmtTime(v){ if(v==null||v==="") return "未设时间"; v=Number(v); const u=DB.meta.unit||"年"; return v>=0?`游戏第${v+1}${u}`:`游戏开始前${-v}${u}`; }
function fmtTimeShort(v){ if(v==null||v==="") return "未设"; v=Number(v); const u=DB.meta.unit||"年"; return v>=0?`第${v+1}${u}`:`前${-v}${u}`; }
// 时间输入控件：方向(游戏第/游戏开始前[/未设]) + 数量。allowNull 给生卒用。
function timeInput(field, v, allowNull){
  const u=DB.meta.unit||"年", isNull=(v==null||v===""); const vv=isNull?0:Number(v);
  const dir=isNull?"none":(vv>=0?"post":"pre"); const mag=vv>=0?vv+1:-vv;
  return `<span class="tinput" data-tf="${field}">
    <select class="tdir">${allowNull?`<option value="none" ${dir==="none"?"selected":""}>未设</option>`:""}<option value="post" ${dir==="post"?"selected":""}>游戏第</option><option value="pre" ${dir==="pre"?"selected":""}>游戏开始前</option></select>
    <input class="tmag" type="number" min="1" step="1" value="${isNull?"":mag}" ${dir==="none"?"disabled":""}> <span class="tu">${esc(u)}</span></span>`;
}
function readTInput(w){ const dir=w.querySelector(".tdir").value; if(dir==="none") return null; let m=parseInt(w.querySelector(".tmag").value,10); if(!(m>=1)) m=1; return dir==="post"?m-1:-m; }

// ---------- 一致性检查 ----------
function checkConflicts(){
  const cf=[]; const U=DB.meta.unit||"";
  const cmap={}; DB.chars.forEach(c=>cmap[c.id]=c);
  // 生晚于卒
  DB.chars.forEach(c=>{ if(c.born!=null&&c.died!=null&&c.born>c.died) cf.push({type:"生卒矛盾", char:c.id, msg:`「${c.name}」生(${fmtTime(c.born)})晚于卒(${fmtTime(c.died)})`}); });
  // 关系指向不存在
  DB.chars.forEach(c=>(c.rels||[]).forEach(r=>{ if(r.to&&!cmap[r.to]) cf.push({type:"关系悬空", char:c.id, msg:`「${c.name}」的关系指向了不存在的角色`}); }));
  // 出场早于出生 / 晚于死亡
  DB.events.forEach(ev=>(ev.chars||[]).forEach(cid=>{ const c=cmap[cid]; if(!c) return;
    if(c.born!=null&&ev.time<c.born) cf.push({type:"出生前登场", char:cid, event:ev.id, msg:`「${c.name}」在事件"${ev.title}"(${fmtTime(ev.time)})出场，但其出生于 ${fmtTime(c.born)}`});
    if(c.died!=null&&ev.time>c.died) cf.push({type:"死后登场", char:cid, event:ev.id, msg:`「${c.name}」在事件"${ev.title}"(${fmtTime(ev.time)})出场，但其已卒于 ${fmtTime(c.died)}`});
  }));
  // 同一时间分身两地
  const byCharTime={};
  DB.events.forEach(ev=>(ev.chars||[]).forEach(cid=>{ const k=cid+"@"+ev.time; (byCharTime[k]=byCharTime[k]||[]).push(ev); }));
  Object.values(byCharTime).forEach(list=>{ if(list.length>1){
    const places=[...new Set(list.map(e=>(e.place||"").trim()).filter(Boolean))];
    if(places.length>1){ const cid=list[0].chars.find(c=>true); const c=list[0];
      const who=list[0].chars; // fallback
      const cidReal=Object.keys(byCharTime).find(k=>byCharTime[k]===list).split("@")[0];
      cf.push({type:"同时多地", char:cidReal, msg:`「${charName(cidReal)}」在同一时间(${fmtTime(list[0].time)})出现在多个地点：${places.join(" / ")}`, events:list.map(e=>e.id)});
    }
  }});
  return cf;
}
function conflictSet(){ const s={chars:new Set(),events:new Set()}; checkConflicts().forEach(c=>{ if(c.char)s.chars.add(c.char); if(c.event)s.events.add(c.event); (c.events||[]).forEach(e=>s.events.add(e)); }); return s; }

// ---------- 渲染 ----------
function render(){
  document.getElementById("dbTitle").value=DB.meta.title;
  document.getElementById("unit").value=DB.meta.unit;
  const conf=checkConflicts(); const badge=document.getElementById("confBadge");
  badge.style.display=conf.length?"inline":"none"; badge.textContent=conf.length;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("sel",t.dataset.t===tab));
  const m=document.getElementById("main");
  if(tab==="chars") m.innerHTML=renderChars();
  else if(tab==="timeline") m.innerHTML=renderTimeline();
  else m.innerHTML=renderCheck(conf);
  wire();
}

function renderChars(){
  const cs=conflictSet();
  const list=DB.chars.slice().sort((a,b)=>(a.born??1e9)-(b.born??1e9)).map(c=>
    (ct=>`<div class="row ${c.id===selChar?'sel':''} ${cs.chars.has(c.id)?'conflict':''}" data-char="${c.id}" style="${ct?`border-left:5px solid ${ct.color}`:''}">
       ${ct?`<span class="catdot" style="background:${ct.color}"></span>`:''}${esc(c.name)||'(未命名)'} ${c.isNPC?'<span class="tag" style="color:var(--acc);border-color:var(--acc)">NPC</span>':''} <div class="meta">${ct?'<span style="color:'+ct.color+'">'+ct.label+'</span> · ':''}${esc(c.role||'')} ${c.faction?'· '+esc(c.faction):''} ${c.born!=null?'· 生'+fmtTimeShort(c.born):''}</div></div>`)(catOf(c))).join("");
  const c=DB.chars.find(x=>x.id===selChar);
  return `<div class="list"><div class="add"><input id="newChar" placeholder="+ 新角色名，回车添加"></div>${list||'<div class="row meta">还没有角色</div>'}</div>
    <div class="edit">${c?charEditor(c):'<div class="empty">← 选一个角色，或在左侧添加</div>'}</div>`;
}
function charEditor(c){
  const opts=DB.chars.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  const rels=(c.rels||[]).map((r,i)=>`<div class="rel"><select data-rel="${i}" data-k="to"><option value="">—对象—</option>${DB.chars.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}" ${x.id===r.to?'selected':''}>${esc(x.name)}</option>`).join("")}</select>
      <input data-rel="${i}" data-k="type" value="${esc(r.type||'')}" placeholder="关系(如 师徒/夫妻/仇敌)" style="flex:1"><span class="x" data-relx="${i}">✕</span></div>`).join("");
  // 角色弧: 该角色的事件按时间
  const arc=DB.events.filter(e=>(e.chars||[]).includes(c.id)).sort((a,b)=>a.time-b.time)
    .map(e=>`<div class="tlitem" data-goev="${e.id}"><b>${fmtTimeShort(e.time)}</b> · ${esc(e.title)} ${e.place?'<span class="meta">@'+esc(e.place)+'</span>':''}</div>`).join("")||'<small class="hint">该角色暂无事件</small>';
  return `
    <div class="frow"><div class="fld"><label>姓名</label><input data-c="name" value="${esc(c.name)}"></div>
      <div class="fld"><label>别名/字号</label><input data-c="alias" value="${esc(c.alias||'')}"></div></div>
    <div class="fld"><label>分类 (固定4档，决定左栏颜色)</label><div class="cats">${CATS.map(ct=>`<button class="catbtn ${c.category===ct.k?'on':''}" data-cat="${ct.k}" style="${c.category===ct.k?`background:${ct.color};border-color:${ct.color};color:#1a1a1a`:`color:${ct.color};border-color:${ct.color}`}">${ct.label}</button>`).join("")}</div></div>
    <div class="frow"><div class="fld"><label>身份</label><input data-c="role" value="${esc(c.role||'')}"></div>
      <div class="fld"><label>势力/门派</label><input data-c="faction" value="${esc(c.faction||'')}"></div></div>
    <div class="frow"><div class="fld"><label>出生 (世界时间)</label>${timeInput("born", c.born, true)}</div>
      <div class="fld"><label>去世 (未设=在世)</label>${timeInput("died", c.died, true)}</div></div>
    <div class="fld"><label>小传 / 背景 (可分段随好感揭示)</label><textarea data-c="desc">${esc(c.desc||'')}</textarea></div>
    <div class="fld"><label>标签 (逗号分隔)</label><input data-c="tags" value="${esc((c.tags||[]).join(', '))}"></div>

    <div class="sec">人设塑造</div>
    <div class="fld"><label>一句话人设 (表面 trope · 第一印象钩子)</label><input data-c="trope" value="${esc(c.trope||'')}" placeholder="如：叛逆的杂货铺千金"></div>
    <div class="fld"><label>隐藏深度 / 反转内里 (防写扁的关键)</label><textarea data-c="hiddenDepth" placeholder="表面之下真正的渴望/伤口/秘密…">${esc(c.hiddenDepth||'')}</textarea></div>
    <div class="fld"><label>说话腔调</label><input data-c="voice" value="${esc(c.voice||'')}" placeholder="如：冷淡少语/爱掉书袋/市井油滑"></div>

    <div class="sec">NPC / 社交设定 <label class="npctog"><input type="checkbox" data-npc ${c.isNPC?'checked':''}> 这是小镇 NPC（可社交）</label></div>
    ${c.isNPC?npcBlock(c):'<small class="hint">勾选上面的框，展开好感度/礼物/作息/台词/心事件等社交字段。</small>'}

    <div class="sec">关系网</div><div id="relwrap">${rels}</div><button class="btn" id="addRel">+ 加关系</button>
    <div class="sec">角色弧 (TA参与的事件，按世界时间)</div><div class="tl">${arc}</div>
    <div class="del"><button class="btn" id="delChar" style="border-color:var(--bad);color:var(--bad)">删除此角色</button></div>`;
}
function npcBlock(c){
  const g=c.gifts||{}, s=c.schedule||{}, l=c.lines||{};
  const hearts=(c.hearts||[]).map((h,i)=>`<div class="heart">
    <input data-heart="${i}" data-k="h" type="number" min="0" value="${h.h??''}" placeholder="心" style="width:52px">
    <input data-heart="${i}" data-k="place" value="${esc(h.place||'')}" placeholder="地点/时间/条件" style="width:150px">
    <input data-heart="${i}" data-k="desc" value="${esc(h.desc||'')}" placeholder="剧情梗概" style="flex:1">
    <span class="x" data-heartx="${i}">✕</span></div>`).join("")||'<small class="hint">还没有心事件</small>';
  return `<div class="npcbox">
    <div class="frow">
      <div class="fld"><label>生日 (季节+日, 如 春·12)</label><input data-c="birthday" value="${esc(c.birthday||'')}"></div>
      <div class="fld"><label>路线关联 (医/商/文/人情→解锁)</label><input data-c="routeLinks" value="${esc(c.routeLinks||'')}" placeholder="如：武→拜师学「XX剑」"></div>
    </div>
    <div class="sec2">作息 SCHEDULE</div>
    <div class="frow">
      <div class="fld"><label>白天 / 家</label><input data-c="sch_home" value="${esc(s.home||'')}"></div>
      <div class="fld"><label>工作点</label><input data-c="sch_work" value="${esc(s.work||'')}"></div>
      <div class="fld"><label>晚上</label><input data-c="sch_evening" value="${esc(s.evening||'')}"></div>
    </div>
    <div class="sec2">礼物偏好 (逗号分隔 · 送对＝懂 TA)</div>
    <div class="fld gift"><label>❤ 爱 <input data-c="gift_loved" value="${esc((g.loved||[]).join(', '))}" style="flex:1"></label></div>
    <div class="fld gift"><label>👍 喜欢 <input data-c="gift_liked" value="${esc((g.liked||[]).join(', '))}" style="flex:1"></label></div>
    <div class="fld gift"><label>👎 讨厌 <input data-c="gift_disliked" value="${esc((g.disliked||[]).join(', '))}" style="flex:1"></label></div>
    <div class="sec2">台词池 (随好感层级)</div>
    <div class="fld"><label>初识</label><textarea data-c="line_met" style="min-height:48px">${esc(l.met||'')}</textarea></div>
    <div class="fld"><label>熟络</label><textarea data-c="line_warm" style="min-height:48px">${esc(l.warm||'')}</textarea></div>
    <div class="fld"><label>密友</label><textarea data-c="line_close" style="min-height:48px">${esc(l.close||'')}</textarea></div>
    <div class="sec2">心事件 (L2 · 分心数触发的剧情演出)</div>
    <div id="heartwrap">${hearts}</div><button class="btn" id="addHeart" style="margin-top:6px">+ 加心事件</button>
  </div>`;
}

// 横向 X 轴时间轴图：真实时间比例定位，事件落成节点，可点、可悬停、矛盾红标
function axisGraph(cs){
  const evs=DB.events.slice().sort((a,b)=>a.time-b.time);
  if(!evs.length) return `<div class="axempty">还没有事件——在下方左栏添加事件，它们会按世界时间落在这条轴上。</div>`;
  const times=[...new Set(evs.map(e=>e.time))].sort((a,b)=>a-b);
  const tmin=times[0], tmax=times[times.length-1];
  const span=(tmax-tmin)||1;
  let minGap=Infinity; for(let i=1;i<times.length;i++){ const d=times[i]-times[i-1]; if(d>0) minGap=Math.min(minGap,d); }
  if(!isFinite(minGap)) minGap=span;
  let pxPerUnit=Math.max(600/span, 74/minGap);
  let innerW=span*pxPerUnit;
  if(innerW>3200){ innerW=3200; pxPerUnit=innerW/span; } if(innerW<600) innerW=600;
  const padL=54, padR=64;
  const xOf=t=> (tmax===tmin) ? padL+innerW/2 : padL+(t-tmin)*pxPerUnit;
  const groups={}; evs.forEach(e=>(groups[e.time]=groups[e.time]||[]).push(e));
  let maxStack=1; times.forEach(t=>maxStack=Math.max(maxStack,groups[t].length));
  const rowH=24, topPad=16, baseY=topPad+maxStack*rowH+8, H=baseY+40, W=innerW+padL+padR;
  const cut=s=>{ s=s||"(无题)"; return s.length>9?s.slice(0,9)+"…":s; };
  let ticks="", nodes="";
  times.forEach(t=>{
    const x=xOf(t);
    ticks+=`<line x1="${x}" y1="${baseY}" x2="${x}" y2="${baseY+7}" stroke="#4a5568"/>`
         + `<text x="${x}" y="${baseY+23}" text-anchor="middle" class="axt">${fmtTimeShort(t)}</text>`;
    groups[t].forEach((e,i)=>{
      const y=baseY-12-i*rowH, bad=cs.events.has(e.id), sel=e.id===selEvent;
      const fill=bad?'var(--bad)':(sel?'var(--acc)':'#7c93b3');
      nodes+=`<line x1="${x}" y1="${baseY}" x2="${x}" y2="${y+5}" stroke="#3a4556"/>`
        + `<g class="axnode" data-ev="${e.id}" style="cursor:pointer">`
        + `<title>${esc(e.title)||'(无题)'} · ${t}${esc(DB.meta.unit)}${e.place?' @'+esc(e.place):''}${e.type?' ['+esc(e.type)+']':''}${bad?' ⚠矛盾':''}</title>`
        + `<circle cx="${x}" cy="${y}" r="${sel?7:5}" fill="${fill}" stroke="${sel?'#fff':'none'}" stroke-width="1.5"/>`
        + `<text x="${x+9}" y="${y+4}" class="axlbl ${bad?'bad':''}">${esc(cut(e.title))}</text></g>`;
    });
  });
  const axis=`<line x1="${padL-24}" y1="${baseY}" x2="${padL+innerW+24}" y2="${baseY}" stroke="#5a6b82" stroke-width="2"/>`
    + `<polygon points="${padL+innerW+34},${baseY} ${padL+innerW+26},${baseY-4} ${padL+innerW+26},${baseY+4}" fill="#5a6b82"/>`;
  // 基准线：游戏开始(V=0)
  let base="";
  if(tmin<=0 && 0<=tmax && tmax!==tmin){ const x0=xOf(0);
    base=`<line x1="${x0}" y1="${topPad-4}" x2="${x0}" y2="${baseY}" stroke="var(--gold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>`
       + `<text x="${x0}" y="${topPad-8}" text-anchor="middle" class="axt" style="font-size:11px">游戏开始</text>`;
  }
  return `<svg class="axsvg" width="${W}" height="${H}">${axis}${base}${ticks}${nodes}</svg>`;
}
function renderTimeline(){
  const cs=conflictSet();
  const evs=DB.events.slice().sort((a,b)=>a.time-b.time);
  const groups={}; evs.forEach(e=>{ (groups[e.time]=groups[e.time]||[]).push(e); });
  const tl=Object.keys(groups).map(Number).sort((a,b)=>a-b).map(t=>
    `<div class="tlgroup"><div class="tltime">▸ ${fmtTime(t)}</div>${groups[t].map(e=>
      `<div class="tlitem ${cs.events.has(e.id)?'conflict':''} ${e.id===selEvent?'sel':''}" data-ev="${e.id}" style="${cs.events.has(e.id)?'box-shadow:inset 3px 0 0 var(--bad)':''}">
        <b>${esc(e.title)||'(无题)'}</b> ${e.place?'<span class="meta">@'+esc(e.place)+'</span>':''} ${e.type?'<span class="tag">'+esc(e.type)+'</span>':''}
        <div class="who">${(e.chars||[]).map(charName).join('、')||'无角色'}</div></div>`).join("")}</div>`).join("")
    || '<div class="empty">还没有事件</div>';
  const e=DB.events.find(x=>x.id===selEvent);
  return `<div class="tlwrap">
    <div class="axisband"><div class="axhead">📈 世界时间轴 · 点节点查看/编辑，悬停看详情，<span style="color:var(--bad)">红色</span>=有矛盾</div>${axisGraph(cs)}</div>
    <div class="tlmain">
      <div class="list"><div class="add"><input id="newEv" placeholder="+ 新事件标题，回车添加"></div><div style="padding:6px 10px">${tl}</div></div>
      <div class="edit">${e?eventEditor(e):'<div class="empty">← 选一个事件，或在左侧/轴上点选</div>'}</div>
    </div></div>`;
}
function eventEditor(e){
  const chips=DB.chars.map(c=>`<span class="chip ${(e.chars||[]).includes(c.id)?'on':''}" data-toggle="${c.id}">${esc(c.name)}</span>`).join("")||'<small class="hint">先去"角色"页加角色</small>';
  return `
    <div class="frow"><div class="fld"><label>世界时间</label>${timeInput("time", e.time)}</div>
      <div class="fld"><label>标题</label><input data-e="title" value="${esc(e.title)}"></div></div>
    <div class="frow"><div class="fld"><label>地点</label><input data-e="place" value="${esc(e.place||'')}"></div>
      <div class="fld"><label>类型</label><input data-e="type" value="${esc(e.type||'')}" placeholder="主线/支线/战斗/情感/世界…"></div></div>
    <div class="fld"><label>描述 / 发生了什么</label><textarea data-e="desc" style="min-height:120px">${esc(e.desc||'')}</textarea></div>
    <div class="sec">参与角色 (点选)</div><div class="chips">${chips}</div>
    <div class="del"><button class="btn" id="delEv" style="border-color:var(--bad);color:var(--bad)">删除此事件</button></div>`;
}

function renderCheck(conf){
  const body = conf.length? conf.map(c=>`<div class="conf"><span class="t">⚠ ${c.type}</span><br>${esc(c.msg)}
     ${c.char?`<span class="lk" data-goc="${c.char}">→ 看角色</span>`:''} ${c.event?`<span class="lk" data-goev="${c.event}">→ 看事件</span>`:''}</div>`).join("")
    : `<div class="ok" style="font-size:16px;padding:20px 0">✓ 目前没检测到时间线矛盾。</div>`;
  return `<div class="edit" style="width:100%">
    <p class="hint">自动扫描：出生前登场 / 死后登场 / 同一时间分身两地 / 生晚于卒 / 关系指向不存在的人。改了角色的生卒或事件时间会实时更新。</p>
    ${body}</div>`;
}

// ---------- 交互 ----------
function wire(){
  document.querySelectorAll("[data-char]").forEach(el=>el.onclick=()=>{ selChar=el.dataset.char; render(); });
  const nc=document.getElementById("newChar"); if(nc) nc.onkeydown=e=>{ if(e.key==="Enter"&&nc.value.trim()){ const id=uid(); DB.chars.push({id,name:nc.value.trim(),rels:[],tags:[]}); selChar=id; save(); render(); } };
  document.querySelectorAll("[data-c]").forEach(el=>el.oninput=()=>{ const c=DB.chars.find(x=>x.id===selChar); if(!c)return; const k=el.dataset.c;
    if(k==="tags") c.tags=el.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    else if(k==="born"||k==="died") c[k]=el.value===""?null:Number(el.value);
    else if(k.startsWith("gift_")){ c.gifts=c.gifts||{}; c.gifts[k.slice(5)]=el.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean); }
    else if(k.startsWith("sch_")){ c.schedule=c.schedule||{}; c.schedule[k.slice(4)]=el.value; }
    else if(k.startsWith("line_")){ c.lines=c.lines||{}; c.lines[k.slice(5)]=el.value; }
    else c[k]=el.value; save(); const conf=checkConflicts(); const b=document.getElementById("confBadge"); if(b){ b.style.display=conf.length?"inline":"none"; b.textContent=conf.length; } });
  document.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{ const c=DB.chars.find(x=>x.id===selChar); if(!c)return; c.category=(c.category===el.dataset.cat?null:el.dataset.cat); save(); render(); });
  const npcCb=document.querySelector("[data-npc]"); if(npcCb) npcCb.onchange=()=>{ const c=DB.chars.find(x=>x.id===selChar); if(!c)return; c.isNPC=npcCb.checked; save(); render(); };
  const ah=document.getElementById("addHeart"); if(ah) ah.onclick=()=>{ const c=DB.chars.find(x=>x.id===selChar); c.hearts=c.hearts||[]; c.hearts.push({h:2,place:"",desc:""}); save(); render(); };
  document.querySelectorAll("[data-heart]").forEach(el=>el.onchange=el.oninput=()=>{ const c=DB.chars.find(x=>x.id===selChar); const i=+el.dataset.heart; const k=el.dataset.k; c.hearts[i][k]= k==="h"?(el.value===""?null:Number(el.value)):el.value; save(); });
  document.querySelectorAll("[data-heartx]").forEach(el=>el.onclick=()=>{ const c=DB.chars.find(x=>x.id===selChar); c.hearts.splice(+el.dataset.heartx,1); save(); render(); });
  const ar=document.getElementById("addRel"); if(ar) ar.onclick=()=>{ const c=DB.chars.find(x=>x.id===selChar); c.rels=c.rels||[]; c.rels.push({to:"",type:""}); save(); render(); };
  document.querySelectorAll("[data-rel]").forEach(el=>el.onchange=el.oninput=()=>{ const c=DB.chars.find(x=>x.id===selChar); const i=+el.dataset.rel; c.rels[i][el.dataset.k]=el.value; save(); });
  document.querySelectorAll("[data-relx]").forEach(el=>el.onclick=()=>{ const c=DB.chars.find(x=>x.id===selChar); c.rels.splice(+el.dataset.relx,1); save(); render(); });
  const dc=document.getElementById("delChar"); if(dc) dc.onclick=()=>{ if(confirm("删除这个角色？")){ DB.chars=DB.chars.filter(x=>x.id!==selChar); selChar=null; save(); render(); } };
  // events
  document.querySelectorAll("[data-ev]").forEach(el=>el.onclick=()=>{ selEvent=el.dataset.ev; render(); });
  const ne=document.getElementById("newEv"); if(ne) ne.onkeydown=e=>{ if(e.key==="Enter"&&ne.value.trim()){ const id=uid(); const t=DB.events.length?Math.max(...DB.events.map(x=>x.time)):0; DB.events.push({id,title:ne.value.trim(),time:t,chars:[]}); selEvent=id; save(); render(); } };
  document.querySelectorAll("[data-e]").forEach(el=>el.oninput=()=>{ const e=DB.events.find(x=>x.id===selEvent); if(!e)return; const k=el.dataset.e; e[k]= k==="time"?Number(el.value):el.value; save(); if(k==="time"){ render(); } });
  // 时间控件 (事件time / 角色born,died)：输入时静默存，失焦/回车/换方向时全渲染刷新轴与列表
  document.querySelectorAll(".tinput").forEach(w=>{ const f=w.dataset.tf, magEl=w.querySelector(".tmag"), dirEl=w.querySelector(".tdir");
    const apply=doRender=>{ const val=readTInput(w);
      if(f==="time"){ const e=DB.events.find(x=>x.id===selEvent); if(!e)return; e.time=(val==null?0:val); }
      else { const c=DB.chars.find(x=>x.id===selChar); if(!c)return; c[f]=val; }
      save(); const conf=checkConflicts(); const b=document.getElementById("confBadge"); if(b){ b.style.display=conf.length?"inline":"none"; b.textContent=conf.length; }
      if(doRender) render(); };
    dirEl.onchange=()=>apply(true); magEl.oninput=()=>apply(false); magEl.onchange=()=>apply(true); });
  document.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{ const e=DB.events.find(x=>x.id===selEvent); const id=el.dataset.toggle; e.chars=e.chars||[]; const i=e.chars.indexOf(id); if(i<0)e.chars.push(id); else e.chars.splice(i,1); save(); render(); });
  const de=document.getElementById("delEv"); if(de) de.onclick=()=>{ if(confirm("删除这个事件？")){ DB.events=DB.events.filter(x=>x.id!==selEvent); selEvent=null; save(); render(); } };
  // jumps
  document.querySelectorAll("[data-goc]").forEach(el=>el.onclick=()=>{ tab="chars"; selChar=el.dataset.goc; render(); });
  document.querySelectorAll("[data-goev]").forEach(el=>el.onclick=()=>{ tab="timeline"; selEvent=el.dataset.goev; render(); });
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ tab=t.dataset.t; render(); });
document.getElementById("dbTitle").oninput=e=>{ DB.meta.title=e.target.value; save(); };
document.getElementById("unit").oninput=e=>{ DB.meta.unit=e.target.value; save(); render(); };
document.getElementById("expBtn").onclick=()=>{ const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(DB.meta.title||"世界圣经")+".json"; a.click(); };
document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
document.getElementById("impFile").onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.chars&&d.events){ DB=d; selChar=selEvent=null; save(); render(); alert("导入成功"); } else alert("文件格式不对"); }catch(err){ alert("解析失败"); } }; r.readAsText(f); };
render();
</script>
